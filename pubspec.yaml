name: fieldai_flutter
description: "FieldAI - Offline AI Agricultural Assistant Flutter Mobile Application"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  dio: ^5.4.1
  sqflite: ^2.3.2
  path: ^1.9.0
  shared_preferences: ^2.2.2
  uuid: ^4.3.3
  intl: ^0.20.2
  image_picker: ^1.0.7
  geolocator: ^11.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/labels/
